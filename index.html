<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K.A. Conceito</title>
<meta name="description" content="K.A. Conceito &middot; Uniformes e bordados em Barreiras, BA. WhatsApp, Instagram, localiza&ccedil;&atilde;o e Pix.">
<meta name="theme-color" content="#ECE8E3">
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<style>:root{--bg:#ECE8E3;--ink:#46454A;--teal:#4A8780;--mut:#7B7A80;--line:rgba(70,69,74,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);overflow-x:hidden}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:radial-gradient(120% 60% at 50% 0,#F6F3EF 0,#ECE8E3 55%,#E2DDD6 100%)}
.wrap{position:relative;max-width:480px;margin:0 auto;padding:34px 20px 40px}
.logo{display:block;width:min(78%,330px);height:auto;margin:0 auto}
.hero{text-align:center;margin-bottom:26px}
.orn{margin:10px 0 0;font:600 11.5px Inter,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--teal)}
.sub{margin:8px 0 0;color:var(--mut);font-size:13.5px}
.btn{position:relative;display:flex;align-items:center;gap:14px;width:100%;margin:0 0 12px;padding:14px 16px;border-radius:18px;text-decoration:none;color:var(--ink);background:linear-gradient(180deg,#FFFFFF,#F3F0EC);border:1px solid var(--line);box-shadow:0 10px 22px rgba(70,69,74,.12),inset 0 1px 0 #fff;transition:transform .18s,box-shadow .18s;cursor:pointer;font:inherit;text-align:left}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 26px rgba(70,69,74,.18),inset 0 1px 0 #fff}
.btn:active{transform:scale(.985)}
.ic{flex:0 0 46px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line)}
.ic svg{width:25px;height:25px}
.t{flex:1;min-width:0}
.t b{display:block;font:600 16px Inter,sans-serif;letter-spacing:.005em}
.t span{display:block;margin-top:2px;font-size:12.5px;color:var(--mut)}
.go{font-size:20px;color:var(--teal)}
.main{color:#F3F1EE;background:linear-gradient(180deg,#56555B,#38373C);border-color:#2E2D31;box-shadow:0 12px 26px rgba(40,40,44,.35),inset 0 1px 0 rgba(255,255,255,.14)}
.main .ic{background:#2D2C30;border-color:rgba(255,255,255,.12)}
.main .t span{color:#C9C7CC}
.main .go{color:#9ED0C8}
.sec{margin:22px 0 12px;text-align:center;font:600 11.5px Inter,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--mut)}
.copy{margin:20px 0 0;text-align:center;color:var(--mut);font-size:12px}
.foot{margin-top:14px;padding-top:18px;border-top:1px solid var(--line);text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.c{margin:0;color:var(--mut);font-size:12px;line-height:1.6}
.c b{font-weight:600;color:var(--ink);font-size:13px}
.ct{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.cta{display:inline-block;margin-top:4px;padding:10px 18px;border-radius:12px;border:1px solid var(--teal);color:var(--teal);text-decoration:none;font-weight:600;font-size:13.5px}
.cta:hover{background:var(--teal);color:#fff}
a:focus-visible,button:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#38373C;color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.rw{position:relative;margin:0 -20px 22px}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 20px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch;cursor:grab}
.rail::-webkit-scrollbar{display:none}
.rail.dg{scroll-snap-type:none;cursor:grabbing;user-select:none}
.pc{position:relative;flex:none;width:200px;aspect-ratio:4/5;scroll-snap-align:start;border-radius:20px;overflow:hidden;background:#d9d4cd;border:1px solid var(--line);box-shadow:0 14px 28px rgba(70,69,74,.22);display:block;transition:transform .2s;-webkit-tap-highlight-color:transparent}
.pc:hover{transform:translateY(-3px)}
.pc img{display:block;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none}
.nv{position:absolute;top:44%;transform:translateY(-50%);z-index:2;width:36px;height:36px;border-radius:50%;border:1px solid var(--teal);background:rgba(255,255,255,.92);color:var(--teal);font:400 22px/1 Inter,sans-serif;cursor:pointer;display:grid;place-items:center;padding:0 0 3px}
.nv:hover{background:var(--teal);color:#fff}
.pv{left:24px}.nx{right:24px}
@media(hover:none){.nv{display:none}}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 12px}
.duo .btn{margin:0;min-width:0;width:100%;padding:12px 10px;gap:10px;justify-content:center}
.duo .t{flex:none}
.duo .go{display:none}
.duo .ic{flex:0 0 40px;width:40px;height:40px}
.duo .ic svg{width:22px;height:22px}
.duo .t b{font-size:15px}
.igbox{position:relative;margin:0 0 14px;padding:14px 14px 4px;border-radius:24px;background:linear-gradient(180deg,#3a393e,#26252a);border:1px solid #2E2D31;box-shadow:0 16px 32px rgba(70,69,74,.28),inset 0 1px 0 rgba(255,255,255,.08);overflow:hidden}
.ighd{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;padding:0 2px 12px}
.ighd .ic{flex:0 0 44px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center}
.ighd .ic svg{width:24px;height:24px}
.ighd .t{flex:1;min-width:0}.ighd .t b{display:block;font-size:16px}.ighd .t span{font-size:13px;color:#E4E2E7}
.ighd .go{font-size:20px;color:#fff}
.igbox .rw{margin:0 -14px}
.igbox .rail{padding:2px 14px 14px}
.igbox .pc{width:176px;box-shadow:0 10px 20px rgba(0,0,0,.35);border-color:#3a393e}
.igbox .nv{top:50%}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style>
</head>
